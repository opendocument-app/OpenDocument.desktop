[package]
name = "opendocument-desktop"
version = "0.1.0"
description = "OpenDocument Reader for Windows, macOS and Linux"
license = "MPL-2.0"
repository = "https://github.com/opendocument-app/OpenDocument.desktop"
edition = "2021"
rust-version = "1.85"

[lib]
name = "opendocument_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
